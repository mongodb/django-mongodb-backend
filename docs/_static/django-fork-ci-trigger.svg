<svg xmlns="http://www.w3.org/2000/svg" width="830" height="400" viewBox="0 0 830 400" font-family="Helvetica,Arial,sans-serif">
  <rect width="830" height="400" fill="#ffffff"/>
  <style>
    .box { fill: #edf1f7; stroke: #4a5e8a; stroke-width: 1.2; }
    .act { fill: #e6f2ec; stroke: #00684a; stroke-width: 1.2; }
    .actl { fill: #004d37; font-size: 13px; }
    .actd { fill: #3d6c5c; font-size: 11px; }
    .lbl { fill: #212529; font-size: 13px; }
    .albl { fill: #00684a; font-size: 13px; }
    .repol { fill: #253357; font-size: 13px; }
    .mono { fill: #212529; font-size: 12px; font-family: ui-monospace,Menlo,Consolas,monospace; }
    .dim { fill: #6c757d; font-size: 11px; }
    .arrow { fill: none; stroke: #00684a; stroke-width: 1.4; }
    .dep { fill: none; stroke: #70777d; stroke-width: 1.4; }
    .ahead { fill: #00684a; }
    .dhead { fill: #70777d; }
    .kind { fill: #eef7f2; stroke: #4c8a72; stroke-width: 1; }
    .kindt { fill: #004d37; font-size: 12px; font-family: ui-monospace,Menlo,Consolas,monospace; }
    .kindd { fill: #3d6c5c; font-size: 11px; }
    .fail { fill: none; stroke: #b45309; stroke-width: 1.4; }
    .failbox { fill: #fdf4e7; stroke: #b45309; stroke-width: 1; }
    .ftitle { fill: #7c3d08; font-size: 12px; }
    .fnote { fill: #92610f; font-size: 11px; }
    .fhead { fill: #b45309; }
  </style>
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" class="ahead"/>
    </marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" class="dhead"/>
    </marker>
    <marker id="f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" class="fhead"/>
    </marker>
  </defs>

  <!-- Column 1: upstream Django -->
  <rect x="20" y="56" width="190" height="60" rx="6" class="box"/>
  <text x="115" y="79" text-anchor="middle" class="repol">upstream Django</text>
  <text x="115" y="99" text-anchor="middle" class="mono">stable/X.Y.x</text>

  <!-- Column 2: fork -->
  <rect x="300" y="56" width="210" height="60" rx="6" class="box"/>
  <text x="405" y="79" text-anchor="middle" class="repol">mongodb-forks/django</text>
  <text x="405" y="99" text-anchor="middle" class="mono">mongodb-X.Y.x</text>

  <!-- Column 3: Django MongoDB Backend -->
  <rect x="545" y="56" width="235" height="60" rx="6" class="box"/>
  <text x="662" y="79" text-anchor="middle" class="repol">Django MongoDB Backend</text>
  <text x="662" y="99" text-anchor="middle" class="mono">main · X.Y-2.x · update PR</text>

  <!-- rebase arrow -->
  <line x1="212" y1="86" x2="296" y2="86" class="arrow" marker-end="url(#m)"/>
  <text x="254" y="48" text-anchor="middle" class="albl">rebase + force-push</text>
  <text x="254" y="64" text-anchor="middle" class="actd">daily 09:00 UTC</text>

  <!-- dashed: the backend pins the fork branch by ref -->
  <line x1="541" y1="70" x2="516" y2="70" class="dep" stroke-dasharray="5,4" marker-end="url(#d)"/>
  <text x="528" y="40" text-anchor="middle" class="lbl">pins branch by ref</text>

  <!-- retrigger-ci box -->
  <rect x="300" y="240" width="210" height="48" rx="21" class="act"/>
  <text x="405" y="269" text-anchor="middle" class="actl">retrigger-ci action</text>

  <!-- arrow: fork -> retrigger-ci -->
  <line x1="405" y1="118" x2="405" y2="236" class="arrow" marker-end="url(#m)"/>
  <text x="398" y="150" text-anchor="end" class="dim">after a force-push</text>

  <!-- failure path: rebase conflict or rejected push opens an issue -->
  <path d="M 470 118 V 150 H 560 V 156" class="fail" marker-end="url(#f)"/>
  <text x="477" y="140" class="fnote">on failure</text>
  <rect x="562" y="132" width="218" height="64" rx="6" class="failbox"/>
  <text x="671" y="152" text-anchor="middle" class="ftitle">rebase conflict or rejected push</text>
  <text x="671" y="170" text-anchor="middle" class="fnote">opens an issue in the fork</text>
  <text x="671" y="186" text-anchor="middle" class="fnote">for manual rebase</text>

  <!-- Django MongoDB Backend CI box -->
  <rect x="545" y="240" width="235" height="48" rx="21" class="act"/>
  <text x="662" y="269" text-anchor="middle" class="actl">Django MongoDB Backend CI</text>

  <!-- arrow: retrigger-ci -> Django MongoDB Backend CI -->
  <line x1="512" y1="264" x2="541" y2="264" class="arrow" marker-end="url(#m)"/>
  <text x="549" y="228" text-anchor="middle" class="dim">ci_rerun</text>

  <!-- ci_rerun kinds -->
  <rect x="20" y="140" width="230" height="44" rx="6" class="kind"/>
  <text x="135" y="158" text-anchor="middle" class="kindt">branch name</text>
  <text x="135" y="176" text-anchor="middle" class="kindd">dispatch test workflows on that ref</text>
  <line x1="252" y1="162" x2="296" y2="240" class="arrow" marker-end="url(#m)"/>

  <rect x="20" y="242" width="230" height="44" rx="6" class="kind"/>
  <text x="135" y="260" text-anchor="middle" class="kindt">{"pr": N}</text>
  <text x="135" y="278" text-anchor="middle" class="kindd">re-run the PR's workflow runs</text>
  <line x1="252" y1="264" x2="296" y2="264" class="arrow" marker-end="url(#m)"/>

  <rect x="20" y="344" width="230" height="44" rx="6" class="kind"/>
  <text x="135" y="362" text-anchor="middle" class="kindt">evergreen: true</text>
  <text x="135" y="380" text-anchor="middle" class="kindd">retry the Evergreen patch</text>
  <line x1="252" y1="366" x2="296" y2="288" class="arrow" marker-end="url(#m)"/>
</svg>
